name: build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build scanner
        run: pio run -e esp32s3
      - name: Build hardware test
        run: pio run -e esp32s3-test
