[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
monitor_filters =
    esp32_exception_decoder
    time

[env:esp32s3]
build_flags = ${env.build_flags}

; First bring-up: display + buttons only.
[env:esp32s3-test]
build_flags = ${env.build_flags} -DHW_TEST=1

; Display offset calibration: K1/K2 adjust vertical, K3 horizontal.
[env:esp32s3-align]
build_flags = ${env.build_flags} -DALIGN_TEST=1

; Same passive scanner, plus serial 'd' command to inject a local fake drone
; for UI testing. No RF transmission.
[env:esp32s3-demo]
build_flags = ${env.build_flags} -DENABLE_DEMO=1
